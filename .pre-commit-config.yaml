minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: &quality_python >-
          ^DeepMTP/(?:__init__|branch_models|config|data_loading|dataset|evaluation|hpo_progress|hpo_worker|main|main_streamlit|model_factory|persistence|presentation|random_search|random_search_streamlit|reporting|simple_hyperband|simple_hyperband_streamlit|streamlit_adapter|training|utils/(?:__init__|data_utils|eval_utils|model_utils|tests|utils)|tests/(?:__init__|test_config|test_data_loading|test_dataset_offline|test_evaluation|test_hpo_progress|test_model_factory|test_persistence|test_presentation|test_reporting|test_streamlit_adapter|test_training))\.py$
        types_or: [python, pyi]
      - id: ruff-format
        files: *quality_python
        types_or: [python, pyi]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: python
        additional_dependencies: [mypy>=1.16]
        pass_filenames: false
        always_run: true
