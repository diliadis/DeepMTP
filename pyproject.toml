[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "DeepMTP"
dynamic = ["version"]
description = "A deep learning framework for multi-target prediction"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Dimitris Iliadis", email = "dimitrios.iliadis@ugent.be" },
]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "more-itertools>=9",
    "numpy>=1.23",
    "pandas>=1.5",
    "pillow>=9",
    "prettytable>=3.3",
    "scikit-learn>=1.2",
    "torch>=2.0",
]

[project.optional-dependencies]
datasets = [
    "liac-arff>=2.5",
    "requests>=2.28",
    "scikit-multilearn>=0.2",
    "scipy>=1.9",
    "wget>=3.2",
]
hpo = ["ConfigSpace>=1.2"]
image = ["torchvision>=0.15"]
streamlit = ["streamlit>=1.53.0"]
tracking = [
    "tensorboard>=2.12",
    "wandb>=0.15",
]
test = [
    "ConfigSpace>=1.2",
    "liac-arff>=2.5",
    "pytest>=8,<10",
    "requests>=2.28",
    "scikit-multilearn>=0.2",
    "scipy>=1.9",
    "wget>=3.2",
]
quality = [
    "mypy>=1.16",
    "pre-commit>=4.6",
    "ruff>=0.12",
]
docs = [
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2,<4",
]
dev = [
    "ConfigSpace>=1.2",
    "build>=1.2",
    "liac-arff>=2.5",
    "mypy>=1.16",
    "pre-commit>=4.6",
    "pytest>=8,<10",
    "requests>=2.28",
    "ruff>=0.12",
    "scikit-multilearn>=0.2",
    "scipy>=1.9",
    "sphinx>=7,<9",
    "sphinx-rtd-theme>=2,<4",
    "twine>=6",
    "wget>=3.2",
]
all = [
    "ConfigSpace>=1.2",
    "liac-arff>=2.5",
    "requests>=2.28",
    "scikit-multilearn>=0.2",
    "scipy>=1.9",
    "streamlit>=1.53.0",
    "tensorboard>=2.12",
    "torchvision>=0.15",
    "wandb>=0.15",
    "wget>=3.2",
]

[project.urls]
Documentation = "https://deepmtp.readthedocs.io/"
Issues = "https://github.com/diliadis/DeepMTP/issues"
Repository = "https://github.com/diliadis/DeepMTP"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["DeepMTP*"]
exclude = ["DeepMTP.tests*"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["DeepMTP/tests"]
addopts = "-ra -m 'not network and not slow'"
markers = [
    "network: requires external network access or downloaded datasets",
    "slow: takes too long for the default local feedback loop",
    "gpu: requires a CUDA-capable GPU",
    "integration: exercises multiple package layers together",
]

[tool.ruff]
force-exclude = true
line-length = 88
include = [
    "pyproject.toml",
    "DeepMTP/**/*.py",
]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "SIM", "UP"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = [
    "DeepMTP/__init__.py",
    "DeepMTP/branch_models.py",
    "DeepMTP/config.py",
    "DeepMTP/data_loading.py",
    "DeepMTP/dataset.py",
    "DeepMTP/evaluation.py",
    "DeepMTP/hpo_progress.py",
    "DeepMTP/hpo_types.py",
    "DeepMTP/hpo_worker.py",
    "DeepMTP/main.py",
    "DeepMTP/main_streamlit.py",
    "DeepMTP/model_factory.py",
    "DeepMTP/persistence.py",
    "DeepMTP/presentation.py",
    "DeepMTP/random_search.py",
    "DeepMTP/random_search_streamlit.py",
    "DeepMTP/reporting.py",
    "DeepMTP/simple_hyperband.py",
    "DeepMTP/simple_hyperband_streamlit.py",
    "DeepMTP/streamlit_adapter.py",
    "DeepMTP/training.py",
    "DeepMTP/utils/__init__.py",
    "DeepMTP/utils/data_utils.py",
    "DeepMTP/utils/eval_utils.py",
    "DeepMTP/utils/model_utils.py",
    "DeepMTP/utils/tests.py",
    "DeepMTP/utils/utils.py",
]
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_site_packages = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "DeepMTP.config",
    "DeepMTP.branch_models",
    "DeepMTP.data_loading",
    "DeepMTP.dataset",
    "DeepMTP.evaluation",
    "DeepMTP.hpo_progress",
    "DeepMTP.hpo_types",
    "DeepMTP.hpo_worker",
    "DeepMTP.main",
    "DeepMTP.main_streamlit",
    "DeepMTP.model_factory",
    "DeepMTP.persistence",
    "DeepMTP.presentation",
    "DeepMTP.reporting",
    "DeepMTP.random_search",
    "DeepMTP.random_search_streamlit",
    "DeepMTP.simple_hyperband",
    "DeepMTP.simple_hyperband_streamlit",
    "DeepMTP.streamlit_adapter",
    "DeepMTP.training",
    "DeepMTP.utils.eval_utils",
    "DeepMTP.utils.model_utils",
    "DeepMTP.utils.tests",
    "DeepMTP.utils.utils",
]
disallow_incomplete_defs = true
disallow_untyped_defs = true
warn_return_any = true
