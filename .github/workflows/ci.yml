name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test

      - name: Run offline test suite
        run: python -m pytest

  minimum-dependencies:
    name: Test minimum dependency series (Python 3.10)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/minimum.txt

      - name: Install minimum dependency series
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group test --constraint constraints/minimum.txt
          python -m pip check

      - name: Run offline test suite
        run: python -m pytest

  quality:
    name: Lint and type check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group quality

      - name: Run pre-commit quality hooks
        run: pre-commit run --all-files --show-diff-on-failure

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and documentation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group docs

      - name: Build documentation without warnings
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html

  build:
    name: Build distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Inspect distribution metadata
        run: python -m twine check --strict dist/*

      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/deepmtp-wheel-smoke"
          "$RUNNER_TEMP/deepmtp-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/deepmtp-wheel-smoke/bin/python" -m pip install dist/*.whl

      - name: Run installed-wheel CPU smoke test
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/deepmtp-wheel-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_test_installation.py" \
            --require-wheel-install \
            --output-dir "$RUNNER_TEMP/deepmtp-wheel-results"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: deepmtp-distributions
          path: dist/*
          if-no-files-found: error
