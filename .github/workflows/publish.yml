name: Publish to PyPI.org

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Inspect distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify release tag and artifact versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/verify_release_artifacts.py "$RELEASE_TAG" dist/*

      - name: Install verified wheel and optional extras
        run: |
          python -m venv "$RUNNER_TEMP/deepmtp-release-smoke"
          "$RUNNER_TEMP/deepmtp-release-smoke/bin/python" -m pip install --upgrade pip
          for wheel in dist/*.whl; do
            "$RUNNER_TEMP/deepmtp-release-smoke/bin/python" -m pip install "${wheel}[all]"
          done
          "$RUNNER_TEMP/deepmtp-release-smoke/bin/python" -m pip check

      - name: Smoke test verified wheel
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/deepmtp-release-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_test_installation.py" \
            --require-wheel-install \
            --output-dir "$RUNNER_TEMP/deepmtp-release-results"
          "$RUNNER_TEMP/deepmtp-release-smoke/bin/python" \
            "$GITHUB_WORKSPACE/scripts/smoke_test_optional_extras.py" \
            --require-wheel-install

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deepmtp-release-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    name: Publish verified distributions to PyPI
    needs: release-build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/DeepMTP
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deepmtp-release-distributions
          path: dist
          digest-mismatch: error

      - name: Publish package with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true
